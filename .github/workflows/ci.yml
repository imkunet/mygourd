name: ci

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: setup viteplus
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '25'
          registry-url: 'https://registry.npmjs.org'
          run-install: false

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install dependencies
        run: bun link && bun ci

      - name: lint
        run: vp lint

      - name: typecheck
        run: bunx tsgo

      - name: build package
        run: vp pack

      - name: release new version
        run: npm publish
